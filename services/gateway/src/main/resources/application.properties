server.port=8080
spring.application.name=gateway

# ---------- Routes ----------
spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=rest
spring.cloud.gateway.server.webflux.routes[1].uri=${services.rest-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/rest/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[2].id=graphql
spring.cloud.gateway.server.webflux.routes[2].uri=${services.graphql-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/graphql
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/graphql

spring.cloud.gateway.server.webflux.routes[3].id=soap
spring.cloud.gateway.server.webflux.routes[3].uri=${services.soap-url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/soap/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[4].id=orchestrator
spring.cloud.gateway.server.webflux.routes[4].uri=${services.orchestrator-url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/orchestrator/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=2

# ---------- Where the services live ----------
# Defaults are for local development; Docker Compose will override them with environment variables.
services.auth-url=${AUTH_URL:http://localhost:8086}
services.rest-url=${REST_URL:http://localhost:8081}
services.soap-url=${SOAP_URL:http://localhost:8082}
services.graphql-url=${GRAPHQL_URL:http://localhost:8083}
services.telemetry-health-url=${TELEMETRY_HEALTH_URL:http://localhost:8084}
services.orchestrator-url=${ORCHESTRATOR_URL:http://localhost:8085}

# ---------- Security ----------
# Same value as in auth-service. No default on purpose: the Gateway refuses to start without it.
jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health